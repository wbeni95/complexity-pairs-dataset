<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Comparisons for n = 1000 merges (1001 piles), previous exact method versus ours, logarithmic scale" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><style>text{fill:#e6edf3;font-size:13px} .m{fill:#9198a1;font-size:12px} .v{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;font-size:12px} .h{font-size:15px;font-weight:600}</style><text x="0" y="18" class="h">Comparisons for n = 1000 merges (1001 piles)</text><text x="760" y="18" text-anchor="end" class="m">exact counts, proved in each entry · logarithmic scale</text><line x1="250.0" y1="34" x2="250.0" y2="200" stroke="#30363d"/><text x="250.0" y="218" text-anchor="middle" class="m">10⁰</text><line x1="370.0" y1="34" x2="370.0" y2="200" stroke="#30363d"/><text x="370.0" y="218" text-anchor="middle" class="m">10³</text><line x1="490.0" y1="34" x2="490.0" y2="200" stroke="#30363d"/><text x="490.0" y="218" text-anchor="middle" class="m">10⁶</text><line x1="610.0" y1="34" x2="610.0" y2="200" stroke="#30363d"/><text x="610.0" y="218" text-anchor="middle" class="m">10⁹</text><text x="238" y="55" text-anchor="end">Maximum merge cost (larger part)</text><text x="238" y="73" text-anchor="end" class="m">and maximum total imbalance: same counts</text><rect x="250" y="40" width="340.9" height="20" rx="2" fill="#6e7681"/><text x="598.9" y="55" class="v">333 833 500</text><rect x="250" y="64" width="247.0" height="20" rx="2" fill="#f0883e"/><text x="505.0" y="79" class="v">1 499 500</text><text x="760" y="79" text-anchor="end" font-weight="600" fill="#f0883e">223× fewer</text><text x="238" y="133" text-anchor="end">Minimum merge cost (smaller part)</text><text x="238" y="151" text-anchor="end" class="m">closed form instead of a DP</text><rect x="250" y="118" width="340.9" height="20" rx="2" fill="#6e7681"/><text x="598.9" y="133" class="v">333 833 500</text><rect x="250" y="142" width="120.0" height="20" rx="2" fill="#f0883e"/><text x="378.0" y="157" class="v">1 000</text><text x="760" y="157" text-anchor="end" font-weight="600" fill="#f0883e">333 834× fewer</text><rect x="250" y="182" width="12" height="12" rx="2" fill="#6e7681"/><text x="268" y="193" class="m">cubic interval DP (every split)</text><rect x="480" y="182" width="12" height="12" rx="2" fill="#f0883e"/><text x="498" y="193" class="m">our method</text></svg>
